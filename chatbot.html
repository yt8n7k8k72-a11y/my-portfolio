<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>윤서의 교육용 안전문서</title>
  <style>
    :root { --green: #16794a; --green-dark: #0d5934; --purple: #673b88; --paper: #ffffff; --bg: #f3f8f4; --ink: #17231d; --line: #cfe0d4; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Malgun Gothic", "Apple SD Gothic Neo", Arial, sans-serif; line-height: 1.65; }
    main { width: min(900px, calc(100% - 32px)); margin: 0 auto; padding: 38px 0 52px; }
    .top-link { display: grid; place-items: center; width: 56px; height: 56px; margin: 0 0 18px auto; border: 2px solid var(--green); border-radius: 50%; background: #fff; overflow: hidden; }
    .top-link img { width: 50px; height: 50px; object-fit: contain; }
    .top-link:hover, .top-link:focus-visible { border-color: var(--purple); box-shadow: 0 0 0 3px #eadff2; }
    header { border-left: 7px solid var(--purple); padding-left: 18px; }
    h1 { margin: 0; color: var(--green-dark); font-size: clamp(1.65rem, 5vw, 2.35rem); line-height: 1.25; }
    .subtitle { margin: 8px 0 0; color: #405449; }
    .notices { display: grid; gap: 10px; margin: 24px 0; }
    .notice { margin: 0; padding: 12px 14px; border-radius: 9px; background: #f1eafa; border: 1px solid #d7c4e8; color: #482466; font-size: .95rem; }
    .search-panel, #result { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 3px 12px rgb(20 70 42 / 7%); }
    .search-panel { padding: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 700; }
    .search-row { display: flex; gap: 10px; }
    input { min-width: 0; flex: 1; padding: 12px 13px; border: 1px solid #96b8a1; border-radius: 8px; color: var(--ink); font: inherit; }
    input:focus { outline: 3px solid #cce5d5; border-color: var(--green); }
    button { flex: 0 0 auto; padding: 12px 18px; border: 0; border-radius: 8px; background: var(--green); color: white; font: inherit; font-weight: 700; cursor: pointer; }
    button:hover, button:focus-visible { background: var(--green-dark); }
    #result { min-height: 98px; margin-top: 20px; padding: 20px; }
    #result h2 { margin: 0 0 12px; color: var(--green-dark); font-size: 1.2rem; }
    #result > p { margin: 0; }
    .hint { color: #53645a; }
    .query { margin: 0 0 16px !important; padding-bottom: 14px; border-bottom: 1px solid var(--line); color: #384b3e; }
    .article { margin-top: 18px; padding: 16px; border-left: 4px solid var(--purple); background: #faf8fc; }
    .article h3 { margin: 0 0 10px; color: #482466; font-size: 1.08rem; }
    .article ol { margin: 0; padding-left: 1.5rem; }
    .article li + li { margin-top: 7px; }
    @media (max-width: 520px) { main { width: min(100% - 22px, 900px); padding-top: 25px; } .search-panel, #result { padding: 15px; } .search-row { flex-direction: column; } button { width: 100%; } }
  </style>
</head>
<body>
  <main>
    <a class="top-link" href="index.html" aria-label="포트폴리오로 돌아가기" title="포트폴리오로 돌아가기"><img src="agumon-navigation.png" alt=""></a>
    <header>
      <h1>윤서의 교육용 안전문서</h1>
      <p class="subtitle">질문에 포함된 조항 제목의 핵심 단어로 교육용 안전규정을 찾습니다.</p>
    </header>
    <section class="notices" aria-label="이용 안내">
      <p class="notice">이 화면은 실제 AI 답변이 아닌, 문서 조항을 찾아 보여주는 교육용 규칙검색 화면입니다.</p>
      <p class="notice">교육용 문서이므로 현장 판단에 사용할 수 없습니다. 현장에서는 소속 사업장의 안전관리자 지침을 따르십시오.</p>
    </section>
    <section class="search-panel" aria-label="규정 검색">
      <label for="question">질문 입력</label>
      <div class="search-row">
        <input id="question" type="text" placeholder="예: 고소작업 시 확인할 사항" autocomplete="off">
        <button id="searchButton" type="button">검색</button>
      </div>
    </section>
    <section id="result" aria-live="polite">
      <h2>검색 결과</h2>
      <p class="hint">조항 제목의 핵심 단어(예: 개인보호구, 고소작업, 밀폐공간, 전기)를 포함해 질문하세요.</p>
    </section>
  </main>
  <script>
    // 문서 원문을 이 파일 안에 보관하며, 외부 파일이나 API를 읽지 않습니다.
    const rules = [
      { title: '제1조 (개인보호구)', keywords: ['개인보호구', '보호구'], clauses: ['작업장 출입 시 안전모, 안전화, 보안경을 항상 착용한다.', '용접·연삭 작업 시 보안면, 방진마스크, 용접 장갑을 추가로 착용한다.', '보호구가 파손되거나 없는 상태로는 어떤 작업도 시작하지 않는다. "잠깐만"도 예외가 아니다.', '보호구가 없으면 작업을 중단하고 현장 안전관리자에게 지급을 요청한다.'] },
      { title: '제2조 (고소작업)', keywords: ['고소작업'], clauses: ['높이 2m 이상에서 작업할 때는 작업 시작 전에 안전대를 착용하고, 지정된 걸이 지점에 건다.', '추락 위험이 있는 개구부와 작업 발판 가장자리에는 안전난간을 먼저 설치한다.', '강풍(순간풍속 10m/s 이상), 강우, 강설 시 옥외 고소작업을 중지한다.', '사다리 위에서 용접·연삭 등 양손 작업을 하지 않는다.'] },
      { title: '제3조 (밀폐공간)', keywords: ['밀폐공간'], clauses: ['탱크, 이중저, 코퍼댐 등 밀폐공간에 들어가기 전에 산소농도(18~23.5%)와 유해가스 농도를 측정하고 기록한다.', '측정 결과가 기준을 벗어나면 환기 후 재측정하고, 기준에 들어올 때까지 출입하지 않는다.', '출입 전 밀폐공간 작업 허가서를 발급받고, 외부에 감시인 1명 이상을 배치한다.', '작업 중에도 산소농도를 계속 측정하고, 감시인은 출입구를 떠나지 않는다.'] },
      { title: '제4조 (용접·화기작업)', keywords: ['용접', '화기작업'], clauses: ['화기작업 전에 화기작업 허가서를 발급받고, 반경 10m 이내의 가연물을 제거하거나 불연 덮개로 덮는다.', '화기작업 중에는 화재감시자를 배치하고, 소화기를 작업 위치 3m 이내에 둔다.', '화재감시자는 작업 종료 후 30분간 현장을 감시한다.', '가스 호스와 용접 케이블의 손상 여부를 작업 전에 점검한다.'] },
      { title: '제5조 (크레인·중량물)', keywords: ['크레인', '중량물'], clauses: ['크레인으로 중량물을 인양하는 동안 인양물 아래와 반경 내에 사람이 서거나 지나가지 않는다.', '신호수는 1명만 지정하고, 운전자는 지정된 신호수의 신호에만 따른다.', '와이어로프, 슬링, 샤클은 작업 전 점검하고 손상된 것은 즉시 폐기한다.', '인양물의 무게가 정격 하중을 초과하면 인양하지 않는다.'] },
      { title: '제6조 (전기)', keywords: ['전기'], clauses: ['전기 설비 작업 전에 전원을 차단하고 잠금장치(LOTO)와 표지를 부착한다.', '젖은 손이나 젖은 장소에서 전기 기기를 다루지 않는다.', '피복이 벗겨진 전선과 파손된 콘센트는 사용하지 않고 즉시 신고한다.', '이동식 전기 기기는 누전차단기를 거쳐 사용한다.'] },
      { title: '제7조 (화학물질)', keywords: ['화학물질'], clauses: ['도료, 희석제, 세척제 등 화학물질을 다루기 전에 물질안전보건자료(MSDS)를 확인한다.', '화학물질을 다룰 때는 내화학 장갑과 보안경을 착용하고 환기를 유지한다.', '화학물질 용기에는 반드시 내용물 표시 라벨을 부착하고, 음료 용기에 옮겨 담지 않는다.', '피부에 닿거나 눈에 들어가면 즉시 흐르는 물로 15분 이상 씻고 보고한다.'] },
      { title: '제8조 (출입통제)', keywords: ['출입통제'], clauses: ['지정된 출입구로만 출입하고, 출입증을 항상 패용한다.', '위험구역(도장 중, 방사선 검사 중, 인양 중)에는 출입 표지가 있는 동안 들어가지 않는다.', '외부 방문자는 안전교육 이수 후 인솔자와 함께 이동한다.', '작업장 내에서는 지정된 보행로로 이동하고 뛰지 않는다.'] },
      { title: '제9조 (비상대응)', keywords: ['비상대응'], clauses: ['화재, 가스 누출, 추락 등 비상 상황을 발견하면 즉시 큰 소리로 알리고 비상연락번호로 신고한다.', '대피 방송이 나오면 작업을 멈추고 지정된 대피 경로로 집결지에 모인다.', '엘리베이터와 크레인은 대피에 사용하지 않는다.', '소화기, 비상샤워, 구급함의 위치를 작업 시작 전에 확인한다.'] },
      { title: '제10조 (사고보고)', keywords: ['사고보고'], clauses: ['부상, 아차사고, 설비 손상은 크기와 관계없이 당일 안전관리자에게 보고한다.', '사고 현장은 조사가 끝날 때까지 보존한다.', '보고 내용에는 일시, 장소, 작업 내용, 부상 부위, 목격자를 포함한다.', '보고자에게 불이익을 주지 않는다.'] }
    ];
    const input = document.querySelector('#question');
    const result = document.querySelector('#result');
    const ambiguousWords = ['안전', '규정', '작업', '문서', '알려줘', '무엇', '뭐', '어떻게'];

    function addText(parent, tag, value, className) {
      const element = document.createElement(tag);
      element.textContent = value;
      if (className) element.className = className;
      parent.append(element);
      return element;
    }
    function showSearch() {
      const question = input.value.trim();
      result.replaceChildren();
      addText(result, 'h2', '검색 결과');
      if (!question || question.length < 2 || ambiguousWords.includes(question)) {
        addText(result, 'p', '질문의 의미가 명확하지 않습니다. 확인하려는 상황이나 핵심 단어를 조금 더 구체적으로 입력해 주세요.');
        return;
      }
      const matches = rules.filter(rule => rule.keywords.some(keyword => question.includes(keyword)));
      if (!matches.length) {
        addText(result, 'p', '입력한 질문과 관련된 조항을 찾지 못했습니다. 문서에 있는 조항의 핵심 단어를 포함해 다시 질문해주세요.');
        return;
      }
      addText(result, 'p', '입력한 질문: ' + question, 'query');
      matches.forEach(rule => {
        const article = document.createElement('article');
        article.className = 'article';
        addText(article, 'h3', rule.title);
        const list = document.createElement('ol');
        rule.clauses.forEach(clause => addText(list, 'li', clause));
        article.append(list);
        result.append(article);
      });
    }
    document.querySelector('#searchButton').addEventListener('click', showSearch);
    input.addEventListener('keydown', event => { if (event.key === 'Enter') showSearch(); });
  </script>
</body>
</html>
